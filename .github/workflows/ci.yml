name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets

  spec-lint:
    name: spec lint (markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check spec files exist
        run: |
          for f in 00-overview 01-skill-isa 02-translation-layer 03-driver-interface 04-tactile-manifold 05-conformance 06-extension-registry; do
            test -f "spec/${f}.md" || { echo "missing spec/${f}.md"; exit 1; }
          done
      - name: Lint markdown (links, dividers, de-AI)
        run: python3 scripts/md_lint.py

  schema-validate:
    name: schema validate (conformance class 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Validate schemas + reference instances + C1-C7 invariants
        run: uv run --with jsonschema --with pyyaml python schemas/validate.py

  cargo-deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20

  msrv:
    name: MSRV (Rust ${{ env.RFL_MSRV }})
    runs-on: ubuntu-latest
    env:
      RFL_MSRV: "1.86"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RFL_MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
