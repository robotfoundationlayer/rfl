# Per-skill ε-tolerance table (spec/02 RD2c, spec/05) — Class 2-loose conformance.
#
# For each contact-dynamics primitive (every force.* + in_hand.pivot passive
# drive), the per-quantity tolerance its REALIZED execution is held to. Canonical
# action GENERATION stays Class 2-strict; only realized execution is loose.
#
# Values are `null` until measured — the data-dependent pre-freeze item. The
# structure is fixed now (schemas/epsilon-tolerance.schema.json) and the primitive
# key set is checked complete by validate.py C9. A null tolerance means the loose
# check is not yet gradeable for that quantity (never silently a pass). The
# measurement harness that fills these is `rfl measure` (see
# docs/design/2026-06-01-epsilon-tolerance-table-design.md and the quantity
# reconciliation in 2026-06-02-measure-quantity-reconciliation-design.md).
#
# Pose is split into realized_position (l2_norm, m) and realized_orientation
# (geodesic_so3, rad): a single ε cannot bound metres and radians at once without
# a length scale, so each component carries its own tolerance in its own unit.
epsilon_tolerances:
  force.insert_fit:
    realized_position:    { metric: l2_norm,      tolerance: null, unit: "m" }
    realized_orientation: { metric: geodesic_so3, tolerance: null, unit: "rad" }
    realized_wrench:      { metric: l2_norm,      tolerance: null, unit: "N" }
    seating_depth:        { metric: abs,          tolerance: null, unit: "m" }
  force.screw:
    completion_torque: { metric: abs, tolerance: null, unit: "N*m" }
    turns:             { metric: abs, tolerance: null }
  force.unscrew:
    completion_torque: { metric: abs, tolerance: null, unit: "N*m" }
    turns:             { metric: abs, tolerance: null }
  force.press_button:
    actuation_force:      { metric: abs,          tolerance: null, unit: "N" }
    realized_position:    { metric: l2_norm,      tolerance: null, unit: "m" }
    realized_orientation: { metric: geodesic_so3, tolerance: null, unit: "rad" }
  force.snap_engage:
    engagement_force:     { metric: abs,          tolerance: null, unit: "N" }
    realized_position:    { metric: l2_norm,      tolerance: null, unit: "m" }
    realized_orientation: { metric: geodesic_so3, tolerance: null, unit: "rad" }
  force.cut:
    cut_depth:       { metric: abs,     tolerance: null, unit: "m" }
    realized_wrench: { metric: l2_norm, tolerance: null, unit: "N" }
  force.wipe:
    contact_force:        { metric: abs,          tolerance: null, unit: "N" }
    realized_position:    { metric: l2_norm,      tolerance: null, unit: "m" }
    realized_orientation: { metric: geodesic_so3, tolerance: null, unit: "rad" }
  force.scrub:
    contact_force:         { metric: abs, tolerance: null, unit: "N" }
    oscillation_amplitude: { metric: abs, tolerance: null, unit: "m" }
  force.push:
    realized_position:    { metric: l2_norm,      tolerance: null, unit: "m" }
    realized_orientation: { metric: geodesic_so3, tolerance: null, unit: "rad" }
    realized_wrench:      { metric: l2_norm,      tolerance: null, unit: "N" }
  force.pull:
    realized_position:    { metric: l2_norm,      tolerance: null, unit: "m" }
    realized_orientation: { metric: geodesic_so3, tolerance: null, unit: "rad" }
    realized_wrench:      { metric: l2_norm,      tolerance: null, unit: "N" }
  in_hand.pivot:
    final_orientation: { metric: geodesic_so3, tolerance: null, unit: "rad" }
    securing_force:    { metric: abs,          tolerance: null, unit: "N" }
