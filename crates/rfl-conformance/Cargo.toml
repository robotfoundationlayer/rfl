[package]
name = "rfl-conformance"
description = "Robot Foundation Layer — conformance test runner. Verifies that a driver implementation meets the RFL specification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Build docs with all features enabled on docs.rs.
[package.metadata.docs.rs]
all-features = true

[dependencies]
rfl-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
boon = "0.6"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"

[dev-dependencies]
insta.workspace = true
serde_yaml.workspace = true
