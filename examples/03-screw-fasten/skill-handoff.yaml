# Example 03 — Two-party handoff (transport.handoff variant)
# A bimanual co-grasp: transfer a held object from the giver's grasp to a partner effector's
# grasp, using two-party make-before-break (the receiver is confirmed securing before the giver
# releases). Exercises GC6 (spec/05): at every instant at least one party secures the object, and
# the combined co-grasp force stays within cograsp_force_budget during the dual-grasp window.
skill: object-handoff
description: >
  Grasp a part, hand it off to a partner effector (the receiver confirmed before the giver
  releases), then release. The object is secured by at least one party throughout, and the two
  effectors never crush it or fight each other beyond the combined-force budget.

objects:
  part: { ref: part, estimated_mass: 1.0 N }

body:
  sequence:

    - let: part_t
      from:
        sense.locate:
          target_ref: part
          modality: auto

    - grasp.pinch:
        target: part_t
        force_budget: 8 N
        tactile_target: auto

    - transport.handoff:
        receiver: tcp_index
        receiver_mode: pinch
        cograsp_force_budget: 12 N

    - grasp.release:
        grasp_handle: active
