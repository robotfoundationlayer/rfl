# Example 03 — In-hand regrasp (in_hand.regrasp variant)
# A contact-set transition: switch from one stable grasp to another WITHOUT releasing the object,
# using make-before-break (the new grasp is confirmed before the old is released). Exercises GC3
# (spec/05): the union of old + new contacts secures the object at every instant, and the
# make-before-break ordering is verified from the force trace.
skill: object-regrasp
description: >
  Grasp a part, regrasp it to a new contact configuration (make-before-break, no release), then
  release. The continuity is preserved through the handover by confirming the new grasp first.

objects:
  part: { ref: part, estimated_mass: 1.0 N }

body:
  sequence:

    - let: part_t
      from:
        sense.locate:
          target_ref: part
          modality: auto

    - grasp.pinch:
        target: part_t
        force_budget: 8 N
        tactile_target: auto

    - in_hand.regrasp:
        target_mode: pinch
        grasp_handle: active

    - grasp.release:
        grasp_handle: active
