[workspace]
resolver = "2"
members = [
    "crates/rfl-core",
    "crates/rfl-cli",
    "crates/rfl-conformance",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/robotfoundationlayer/rfl"
homepage = "https://github.com/robotfoundationlayer"
authors = ["Yoichiro Hara <yo@vox.delivery>"]

[workspace.dependencies]
# Core
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# Math / kinematics (placeholder; pin once chosen)
nalgebra = "0.33"

# Testing
proptest = "1"
insta = { version = "1", features = ["yaml"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
